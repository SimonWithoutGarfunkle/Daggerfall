name: Java Spring Boot Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Build step
        run: |
          echo "========================================="
          echo "Step 1: Build"
          echo "Building the Spring Boot application..."
          echo "========================================="

  unit-tests:
    name: Unit Tests (TU)
    runs-on: ubuntu-latest
    needs: build
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Unit Tests step
        run: |
          echo "========================================="
          echo "Step 2: Unit Tests (TU)"
          echo "Running unit tests..."
          echo "========================================="

  integration-tests:
    name: Integration Tests (IT)
    runs-on: ubuntu-latest
    needs: unit-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Integration Tests step
        run: |
          echo "========================================="
          echo "Step 3: Integration Tests (IT)"
          echo "Running integration tests..."
          echo "========================================="

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: integration-tests
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Deploy step
        run: |
          echo "========================================="
          echo "Step 4: Deploy"
          echo "Deploying the application..."
          echo "========================================="

  sonar:
    name: Sonar Analysis
    runs-on: ubuntu-latest
    needs: deploy
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3
      
      - name: Sonar step
        run: |
          echo "========================================="
          echo "Step 5: Sonar"
          echo "Running SonarQube analysis..."
          echo "========================================="
