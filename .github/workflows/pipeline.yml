name: Java Spring Boot Pipeline

on:
  push:
    branches: [ main, master, 2-bg-au-tremplin, dagger-java-sdk ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.19.10"
          args: call build --source=.

  unit-tests:
    name: Unit Tests (TU)
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.19.10"
          args: call unit-tests --source=.

  integration-tests:
    name: Integration Tests (IT)
    runs-on: ubuntu-latest
    needs: unit-tests
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.19.10"
          args: call integration-tests --source=.

  sonar:
    name: Sonar Analysis
    runs-on: ubuntu-latest
    needs: integration-tests
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.19.10"
          args: call sonar --source=.

  deploy:
    name: Deploy
    runs-on: ubuntu-latest
    needs: sonar
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.19.10"
          args: call deploy --source=.
