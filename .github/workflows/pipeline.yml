name: Java Spring Boot Pipeline

on:
  push:
    branches: [ main, master, 2-bg-au-tremplin, dagger-java-sdk ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.19.10"
          args: build --source=.

      - name: Unit Tests
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.19.10"
          args: unit-tests --source=.

      - name: Integration Tests
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.19.10"
          args: integration-tests --source=.

      - name: Code Quality
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.19.10"
          args: sonar

      - name: Deploy
        uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.19.10"
          args: deploy
