name: Java Spring Boot Pipeline

on:
  push:
    branches: [ main, master, 2-bg-au-tremplin, dagger-java-sdk ]
  pull_request:
    branches: [ main, master ]

jobs:
  ci:
    name: CI
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dagger/dagger-for-github@v8.3.0
        with:
          version: "v0.19.10"
          args: call run --source=.
