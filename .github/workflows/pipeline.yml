name: Java Spring Boot Pipeline (Dagger)

on:
  push:
    branches: [ main, master, 2-bg-au-tremplin, dagger-cli ]
  pull_request:
    branches: [ main, master ]

jobs:
  dagger-pipeline:
    name: Dagger CI/CD
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dagger CLI
        run: |
          curl -L https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin sh
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Run Dagger Pipeline
        run: |
          chmod +x ci/run-dagger-cli.sh
          ./ci/run-dagger-cli.sh